<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sn-title sn-desc">
  <title id="sn-title">Schematic diagram of three cultural schema clusters</title>
  <desc id="sn-desc">Illustrative diagram, not data. Three overlapping clusters labelled law, rule and right, each containing unevenly distributed nodes representing individuals holding that schema.</desc>
  <g fill="none" stroke="#990f3d" stroke-width="1" opacity="0.55">
    <circle cx="180" cy="130" r="95"/>
    <circle cx="380" cy="90" r="80"/>
    <circle cx="440" cy="185" r="90"/>
  </g>
  <g fill="#990f3d">
    <circle cx="150" cy="100" r="4"/>
    <circle cx="130" cy="150" r="3"/>
    <circle cx="195" cy="165" r="5"/>
    <circle cx="210" cy="105" r="3"/>
    <circle cx="160" cy="180" r="3.5"/>
    <circle cx="100" cy="130" r="2.5"/>

    <circle cx="370" cy="65" r="4"/>
    <circle cx="400" cy="100" r="3"/>
    <circle cx="355" cy="105" r="3.5"/>
    <circle cx="410" cy="60" r="2.5"/>

    <circle cx="430" cy="200" r="5"/>
    <circle cx="460" cy="160" r="3"/>
    <circle cx="470" cy="210" r="3.5"/>
    <circle cx="410" cy="170" r="3"/>
    <circle cx="490" cy="185" r="2.5"/>
  </g>
  <g fill="#1b1b1b" opacity="0.85" font-family="Playfair Display, Georgia, serif" font-size="15">
    <text x="120" y="55" font-style="italic">law</text>
    <text x="360" y="35" font-style="italic">rule</text>
    <text x="470" y="245" font-style="italic">right</text>
  </g>
</svg>
